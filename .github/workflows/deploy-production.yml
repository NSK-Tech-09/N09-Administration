name: Déployer Administration en production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: administration-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.16.0, run_install: false }
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: service-node/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Vérifier les scripts de déploiement
        run: bash -n deploy/*.sh
      - name: Vérifier le noyau
        run: python -m compileall -q n09_admin tests && python -m unittest discover -s tests -v
      - name: Vérifier et préparer le service
        working-directory: service-node
        run: pnpm install --frozen-lockfile && pnpm test && pnpm prune --prod
      - name: Construire l'artefact immuable
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf 'N09_RELEASE_COMMIT=%s\nN09_RELEASE_BUILT_AT=%s\n' "$RELEASE_COMMIT" "$built_at" > release.env
          tar -czf "n09-administration-$RELEASE_COMMIT.tar.gz" service-node release.env
          sha256sum "n09-administration-$RELEASE_COMMIT.tar.gz" > artifact.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: administration-${{ github.sha }}
          path: |
            n09-administration-${{ github.sha }}.tar.gz
            artifact.sha256
            deploy/remote-deploy.sh
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: administration-${{ github.sha }}
      - name: Vérifier l'identité du serveur et transférer
        env:
          SSHPASS: ${{ secrets.INFOMANIAK_DEPLOY_PASSWORD }}
          SSH_HOST: ${{ secrets.INFOMANIAK_DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.INFOMANIAK_DEPLOY_PORT }}
          SSH_USER: ${{ secrets.INFOMANIAK_DEPLOY_USERNAME }}
          SSH_HOST_KEY: ${{ secrets.INFOMANIAK_SSH_HOST_KEY }}
          DEPLOY_ROOT: ${{ vars.INFOMANIAK_DEPLOY_ROOT }}
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          askpass="$RUNNER_TEMP/ssh-askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' 'printf "%s\\n" "$SSHPASS"' > "$askpass"
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          archive="n09-administration-${GITHUB_SHA}.tar.gz"
          checksum=$(cut -d ' ' -f 1 artifact.sha256)
          remote_archive="$DEPLOY_ROOT/incoming/$archive"
          ssh_options=(-o BatchMode=no -o ConnectTimeout=20 -o NumberOfPasswordPrompts=1)
          remote() {
            local status=1
            for delay in 0 10 20 30; do
              sleep "$delay"
              setsid -w ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$1" </dev/null && return 0
              status=$?
            done
            return "$status"
          }
          remote "mkdir -p '$DEPLOY_ROOT/incoming'"
          setsid -w scp "${ssh_options[@]}" -P "$SSH_PORT" "$archive" deploy/remote-deploy.sh "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/incoming/" </dev/null
          remote "bash '$DEPLOY_ROOT/incoming/remote-deploy.sh' prepare '$DEPLOY_ROOT' '$GITHUB_SHA' '$remote_archive' '$checksum' 5"

          set +e
          setsid -w ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$DEPLOY_ROOT/shared/restart.sh'" </dev/null
          set -e

          healthy=false
          for _ in {1..12}; do
            if body=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$HEALTH_URL") &&
               jq -e --arg commit "$GITHUB_SHA" '.status == "ok" and .release.commit == $commit' <<<"$body" >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [[ $healthy == true ]]; then
            set +e
            remote "bash '$DEPLOY_ROOT/shared/deploy-transaction.sh' finalize '$DEPLOY_ROOT' '$GITHUB_SHA' 5"
            finalize_status=$?
            set -e
            [[ $finalize_status -eq 0 || $finalize_status -eq 255 ]] || exit "$finalize_status"
            exit 0
          fi

          remote "bash '$DEPLOY_ROOT/shared/deploy-transaction.sh' rollback '$DEPLOY_ROOT' '$GITHUB_SHA'"
          set +e
          setsid -w ssh "${ssh_options[@]}" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "'$DEPLOY_ROOT/shared/restart.sh'" </dev/null
          set -e
          for _ in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "$HEALTH_URL" |
               jq -e --arg failed "$GITHUB_SHA" '.status == "ok" and .release.commit != $failed' >/dev/null; then
              echo "healthcheck failed; previous release restored" >&2
              exit 1
            fi
            sleep 5
          done
          echo "healthcheck failed and rollback could not be verified" >&2
          exit 1
